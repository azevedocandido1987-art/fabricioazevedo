table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.6px;text-align:left;font-weight:700;padding:.5rem .4rem;border-bottom:1px solid var(--bd)}td{padding:.55rem .4rem;border-bottom:1px solid var(--bd)}tr:last-child td{border:none}.num{text-align:right;white-space:nowrap}

}
</style>

  else{db=novoDB();const old=localStorage.getItem('fin_db');if(old){try{importarObj(JSON.parse(old));marcarTudo();gravar()}catch(e){}}}

function resumo(ym){
  const R=noMes(db.receitas,ym),D=noMes(db.despesas,ym),Z=noMes(db.dizimos,ym);
  const rec=soma(R),desp=soma(D),dp=soma(D.filter(pg)),z=soma(Z),zp=soma(Z.filter(pg));
  return{R,D,Z,rec,desp,dp,dpend:r2(desp-dp),z,zp,zpend:r2(z-zp),liq:r2(rec-dp-zp),prev:r2(rec-desp-z)};
}
const atrasadas=()=>db.despesas.filter(d=>!pg(d)&&vc(d)<hoje());
function syncDizimo(r){
  const z=db.dizimos.find(d=>d.receita_id===r.id);
  if(!r.dizimo||!(r.dizimo_pct>0)){if(z&&!pg(z))remover('dizimos',z.id);return null}
  const val=r2(r.valor*r.dizimo_pct/100);
  const o=Object.assign(z?{...z}:{id:'dz_'+r.id,receita_id:r.id,status:'pendente',pago_em:null},{descricao:'Dízimo — '+r.descricao,valor:val,data:r.data,pct:r.dizimo_pct});
  if(z&&pg(z)&&val>z.valor){o.status='pendente';o.pago_em=null}
  salvar('dizimos',o);return o;
}
function vencCartao(k,d){
  if(!k||!k.venc)return d;let ym=d.slice(0,7);const dia=+d.slice(8,10);
  if(k.fech){if(dia>=k.fech)ym=addMes(ym,1);if(k.venc<=k.fech)ym=addMes(ym,1)}else if(dia>=k.venc)ym=addMes(ym,1);
  return ym+'-'+p2(Math.min(k.venc,diasNoMes(ym)));
}
function gerarRecorrentes(ym){
  if(ym>addMes(ymAtual(),1))return false;let n=0;
  db.recorrentes.forEach(r=>{
    if(r.ativo===false||(r.inicio&&ym<r.inicio)||(r.puladas||[]).includes(ym))return;
    if(db.despesas.some(d=>d.recorrente_id===r.id&&(d.data||'').startsWith(ym)))return;
    const dt=ym+'-'+p2(Math.min(r.dia||1,diasNoMes(ym))),k=r.forma==='cartao'&&cart(r.cartao_id);
    salvar('despesas',{id:'rr_'+r.id+'_'+ym.replace('-',''),descricao:r.descricao,valor:r.valor,data:dt,vencimento:k?vencCartao(k,dt):dt,categoria_id:r.categoria_id||'',forma:r.forma,cartao_id:r.cartao_id||'',status:'pendente',pago_em:null,recorrente_id:r.id,obs:''});n++;
  });
  return n>0;
}
function porCat(D){const m={};D.forEach(d=>{const k=cat(d.categoria_id)?d.categoria_id:'_';m[k]=(m[k]||0)+(+d.valor||0)});return Object.entries(m).map(([k,v])=>({k,c:cat(k),v:r2(v)})).sort((a,b)=>b.v-a.v)}

function waterfall(s){
  if(!s.rec&&!s.desp&&!s.z)return empty('📊','Sem lançamentos neste mês');
  const st=[{l:'Receitas',a:0,b:s.rec,c:'#22975F',v:s.rec,t:`Receitas: <b>${fmt(s.rec)}</b>`},
   {l:'Dízimo',a:s.rec-s.z,b:s.rec,c:'#C99A2E',v:s.z,p:s.zp,t:`Dízimo: <b>${fmt(s.z)}</b><br>Pago ${fmt(s.zp)} · Pendente ${fmt(s.zpend)}`},
   {l:'Despesas',a:s.rec-s.z-s.desp,b:s.rec-s.z,c:'#D64545',v:s.desp,p:s.dp,t:`Despesas: <b>${fmt(s.desp)}</b><br>Pagas ${fmt(s.dp)} · A pagar ${fmt(s.dpend)}`},
   {l:s.prev>=0?'Sobra':'Falta',a:0,b:s.prev,c:s.prev>=0?'#3B82D6':'#D64545',v:s.prev,t:`${s.prev>=0?'Sobra':'Falta'} prevista: <b>${fmt(s.prev)}</b>`}];
  const vs=st.flatMap(x=>[x.a,x.b]),mx=Math.max(...vs,0),mn=Math.min(...vs,0),W=520,H=215,T=24,B=28,h=H-T-B,y=v=>T+(mx-v)/((mx-mn)||1)*h,bw=72,gp=(W-bw*4)/5;
  let g=`<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#DDD8CC"/>`;
  st.forEach((x,i)=>{const X=gp+i*(bw+gp),hi=Math.max(x.a,x.b),lo=Math.min(x.a,x.b),y1=y(hi),hh=Math.max(2,y(lo)-y1);
    g+=`<g class="hov" ${tip(x.t)}><rect x="${X}" y="${y1}" width="${bw}" height="${hh}" rx="6" fill="${x.c}" opacity="${x.p!=null?.32:1}"/>`;
    if(x.p!=null&&x.p>0)g+=`<rect x="${X}" y="${y1}" width="${bw}" height="${Math.max(2,y(x.b-x.p)-y1)}" rx="6" fill="${x.c}"/>`;
    g+=`<text x="${X+bw/2}" y="${y1-7}" text-anchor="middle" font-size="12" font-weight="700" fill="#1E2633">${fmtC(x.v)}</text><text x="${X+bw/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#5A6372">${x.l}</text></g>`;
    if(i<3){const nv=i===0?x.b:x.a;g+=`<line x1="${X+bw}" x2="${X+bw+gp}" y1="${y(nv)}" y2="${y(nv)}" stroke="#C9C3B6" stroke-dasharray="3 3"/>`}});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`+legenda([['#5A6372','Cor forte = pago'],['#C9C3B6','Cor clara = pendente']]);
}
function donut(D){
  const L=porCat(D),T=soma(D);if(!T)return empty('🍩','Sem despesas neste mês');

  L.forEach(x=>{const len=x.v/T*C,col=x.c?.cor||'#98A0AB';arcs+=`<circle class="hov" ${tip(`${esc(nomeCat(x.c))}<br><b>${fmt(x.v)}</b> · ${(x.v/T*100).toFixed(1).replace('.',',')}%`)} onclick="filtrarCat('${x.k}')" r="${R}" cx="80" cy="80" fill="none" stroke="${col}" stroke-width="24" stroke-dasharray="${Math.max(len-1.5,.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=len});
  const leg=L.slice(0,6).map(x=>`<div class="row cl" style="padding:.38rem .3rem;gap:8px" onclick="filtrarCat('${x.k}')"><i style="width:10px;height:10px;border-radius:3px;background:${x.c?.cor||'#98A0AB'};display:block;flex-shrink:0"></i><div class="ri"><b style="font-size:12.5px;font-weight:500">${esc(nomeCat(x.c))}</b></div><div class="rv" style="font-size:12.5px">${fmt(x.v)}</div><small class="mut" style="width:32px;text-align:right">${Math.round(x.v/T*100)}%</small></div>`).join('');
  return `<div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;justify-content:center"><svg viewBox="0 0 160 160" width="150" height="150" style="flex-shrink:0">${arcs}<text x="80" y="76" text-anchor="middle" font-size="10" fill="#98A0AB" letter-spacing="1">TOTAL</text><text x="80" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1E2633">${fmtC(T)}</text></svg><div style="flex:1;min-width:190px">${leg}</div></div>`;
}
function evolucao(ms){
  const d=ms.map(m=>({m,...resumo(m)})),mx=Math.max(1,...d.flatMap(x=>[x.rec,x.desp+x.z])),mn=Math.min(0,...d.map(x=>x.prev));
  const W=640,H=230,T=14,B=30,h=H-T-B,y=v=>T+(mx-v)/(mx-mn)*h,cw=W/d.length,bw=Math.min(28,cw*.3);
  let g='';[.25,.5,.75,1].forEach(f=>{const v=mn+(mx-mn)*f;g+=`<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#F1EEE7"/>`});
  g+=`<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#DDD8CC"/>`;const pts=[];
  d.forEach((x,i)=>{const cx=cw*i+cw/2,sel=x.m===mes,dz=x.desp+x.z;
    g+=`<g class="hov" onclick="setMes('${x.m}')" ${tip(`<b>${nomeMes(x.m)}</b><br>Receitas ${fmt(x.rec)}<br>Despesas ${fmt(x.desp)}<br>Dízimo ${fmt(x.z)}<br>Sobra ${fmt(x.prev)}`)}><rect x="${cx-cw/2+3}" y="2" width="${cw-6}" height="${H-4}" fill="${sel?'#EAF2FC':'transparent'}" rx="10"/>
    <rect x="${cx-bw-2}" y="${y(x.rec)}" width="${bw}" height="${Math.max(0,y(0)-y(x.rec))}" rx="4" fill="#22975F"/>
    <rect x="${cx+2}" y="${y(dz)}" width="${bw}" height="${Math.max(0,y(0)-y(dz))}" rx="4" fill="#E06B6B"/>
    <text x="${cx}" y="${H-9}" text-anchor="middle" font-size="12" fill="${sel?'#2C6CB8':'#5A6372'}" font-weight="${sel?700:500}">${nomeMes(x.m,1)}</text></g>`;pts.push([cx,y(x.prev)])});
  g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#3B82D6" stroke-width="2.5" stroke-linejoin="round" pointer-events="none"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#3B82D6" stroke-width="2.2" pointer-events="none"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`+legenda([['#22975F','Receitas'],['#E06B6B','Despesas + dízimo'],['#3B82D6','Sobra do mês']]);
}
function orcCard(ym){
  const C=db.categorias.filter(c=>c.orcamento>0&&c.tipo!=='receita');if(!C.length)return '';const D=noMes(db.despesas,ym);

   return `<div style="padding:.35rem 0" ${tip(`${esc(c.nome)}: ${Math.round(p)}% usado<br>Restam ${fmt(c.orcamento-g)}`)}><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:.5rem"><span>${esc(c.icone+' '+c.nome)}</span><span><b class="${p>=100?'red':''}">${fmt(g)}</b> <span class="mut">/ ${fmt(c.orcamento)}</span></span></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${p>=100?'var(--red)':p>=80?'var(--amber)':c.cor||'var(--blue)'}"></i></div></div>`}).join('')}</div></div>`;

function insights(ym){
  const a=resumo(ym),pm=addMes(ym,-1),b=resumo(pm),o=[],atr=atrasadas();
  if(atr.length)o.push(['🚨',`Você tem <b>${atr.length} conta(s) atrasada(s)</b> somando <b>${fmt(soma(atr))}</b>.`]);
  if(a.zpend>0)o.push(['🙏',`Dízimo pendente em ${nomeMes(ym)}: <b>${fmt(a.zpend)}</b>.`]);
  if(a.rec>0){const p=a.prev/a.rec*100;o.push(p>=0?['💡',`Com tudo pago, sobram <b>${fmt(a.prev)}</b>, ou seja, <b>${p.toFixed(0)}%</b> da sua receita.`]:['🔻',`Despesas + dízimo previstos superam as receitas em <b>${fmt(-a.prev)}</b>.`])}
  if(a.desp&&b.desp){const d=(a.desp-b.desp)/b.desp*100;if(Math.abs(d)>=5)o.push([d>0?'📈':'📉',`Despesas ${d>0?'subiram':'caíram'} <b>${Math.abs(d).toFixed(0)}%</b> em relação a ${nomeMes(pm)}.`])}
  const bm=Object.fromEntries(porCat(b.D).map(x=>[x.k,x.v]));let best=null;porCat(a.D).forEach(x=>{const dv=x.v-(bm[x.k]||0);if(bm[x.k]&&dv>0&&(!best||dv>best.dv))best={...x,dv}});
  if(best&&best.dv>=30)o.push(['🔎',`<b>${esc(nomeCat(best.c))}</b> teve o maior aumento: +${fmt(best.dv)} vs mês anterior.`]);
  db.categorias.filter(c=>c.orcamento>0).forEach(c=>{const g=soma(a.D.filter(d=>d.categoria_id===c.id)),p=g/c.orcamento;if(p>=1)o.push(['⛔',`Orçamento de <b>${esc(c.nome)}</b> estourado: ${fmt(g)} de ${fmt(c.orcamento)}.`]);else if(p>=.8)o.push(['⚠️',`<b>${esc(c.nome)}</b> já usou ${Math.round(p*100)}% do orçamento.`])});
  if(ym===ymAtual()){const dia=+hoje().slice(8,10),nd=diasNoMes(ym),g=soma(a.D.filter(d=>!d.recorrente_id&&!d.parcela&&d.data<=hoje()));if(g>0&&dia>=5&&dia<nd)o.push(['🔮',`No ritmo atual, seus gastos variáveis devem fechar o mês em <b>${fmt(g/dia*nd)}</b>.`])}

  return o;
}

  let h=['D','S','T','Q','Q','S','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(first);
  for(let i=1;i<=nd;i++){const v=por[i]||0,a=v?.15+.75*(v/mx):0,dt=ym+'-'+p2(i),rc=R.some(r=>r.data===dt);
    h+=`<div class="d ${dt===hoje()?'t':''}" style="background:${v?`rgba(214,69,69,${a.toFixed(2)})`:'var(--card2)'};color:${a>.55?'#fff':'var(--tx2)'}" onclick="verDia('${dt}')" ${tip(`<b>${fmtD(dt)}</b><br>Gastos ${fmt(v)}${rc?'<br>💰 Entrou receita':''}`)}><b>${i}</b>${rc?'<span style="font-size:8px;line-height:1">💰</span>':''}</div>`}
  return `<div class="cal">${h}</div>`+legenda([['rgba(214,69,69,.25)','Gastou pouco'],['rgba(214,69,69,.9)','Gastou muito'],['#fff','💰 Dia com receita']]);
}
function formas(D){
  const m={};D.forEach(d=>m[d.forma]=(m[d.forma]||0)+(+d.valor||0));const L=Object.entries(m).sort((a,b)=>b[1]-a[1]),T=soma(D);if(!T)return empty('💳','Sem despesas');
  const cs=['#3B82D6','#8B5CF6','#E0A23F','#22975F','#14A3B8','#E05297','#64748B'];
  return `<div style="display:flex;height:14px;border-radius:8px;overflow:hidden;margin-bottom:.5rem">${L.map(([f,v],i)=>`<div class="hov" style="width:${v/T*100}%;background:${cs[i%7]}" ${tip(`${fmtForma(f)}: <b>${fmt(v)}</b> (${Math.round(v/T*100)}%)`)}></div>`).join('')}</div>`+legenda(L.map(([f,v],i)=>[cs[i%7],`${fmtForma(f)} · ${fmt(v)}`]));
}

// ---------- AJUSTES ----------
V.ajustes=()=>{
  const nv=chave()?`<p style="font-size:13px;margin-bottom:.4rem">✅ Este aparelho está conectado à nuvem.</p><p class="mut" style="font-size:12px;margin-bottom:.8rem">Última sincronização: ${db._sync?new Date(db._sync).toLocaleString('pt-BR'):'—'}</p><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn bp" onclick="sincronizar(true)">🔄 Sincronizar agora</button><button class="btn bs" onclick="esquecerChave()">Desconectar aparelho</button></div>`:`<p class="mut" style="font-size:13px;margin-bottom:.8rem">Os dados estão só neste aparelho.</p><button class="btn bp" onclick="pedirChave()">🔒 Digitar código de acesso</button>`;
  const D=noMes(db.despesas,mes);
  return `<h1>Ajustes</h1><div class="sub">Personalize seu controle</div>
  <div class="g2"><div class="card"><div class="ch"><div class="ct">👤 Perfil & dízimo</div></div>
   <div class="fg"><label>Seu nome</label><input value="${esc(db.config.nome||'')}" onchange="setCfg('nome',this.value.trim())" placeholder="Como quer ser chamado"></div>
   <div class="fg"><label>Percentual do dízimo (%)</label><input inputmode="decimal" value="${vstr(db.config.dizimoPct)}" onchange="setCfg('dizimoPct',parseValor(this.value))"><small class="mut">Vale para as novas receitas. As já lançadas mantêm o percentual delas, e você pode ajustar cada uma.</small></div>
   ${dpInstall?`<button class="btn bp" onclick="instalar()">📲 Instalar como aplicativo</button>`:`<small class="mut">📲 Para instalar: no celular, use o menu do navegador › "Adicionar à tela inicial".</small>`}</div>
  <div class="card"><div class="ch"><div class="ct">☁️ Nuvem · Supabase</div><span class="pill ${chave()?'p-ok':'p-bl'}">${chave()?'Conectado':'Só neste aparelho'}</span></div>${nv}</div></div>
  <div class="card"><div class="ch"><div class="ct">🏷️ Categorias & orçamentos</div><button class="btn bp sm" onclick="abrirCat()">+ Nova</button></div>
   <div class="mut" style="font-size:12px;margin:-.3rem 0 .5rem .45rem">Defina um orçamento mensal e acompanhe no Início. Gastos de ${nomeMes(mes)} ao lado.</div>
   ${db.categorias.map(c=>{const g=soma(D.filter(d=>d.categoria_id===c.id));return `<div class="row cl" onclick="abrirCat('${c.id}')">${ico(c)}<div class="ri"><b>${esc(c.nome)}</b><small>${{receita:'Receita',despesa:'Despesa',ambos:'Receita e despesa'}[c.tipo]}${c.orcamento?' · orçamento '+fmt(c.orcamento):''}</small></div>${c.tipo!=='receita'&&g?`<div class="rv" style="font-size:12.5px;font-weight:500">${fmt(g)}</div>`:''}</div>`}).join('')}</div>
  <div class="card"><div class="ch"><div class="ct">💳 Cartões de crédito</div><button class="btn bp sm" onclick="abrirCartao()">+ Novo</button></div>
   ${db.cartoes.length?db.cartoes.map(k=>`<div class="row cl" onclick="abrirCartao('${k.id}')"><div class="ico" style="background:${(k.cor||'#3B82D6')}1F">${esc(k.icone||'💳')}</div><div class="ri"><b>${esc(k.nome)}</b><small>${k.fech?'Fecha dia '+k.fech+' · ':''}${k.venc?'vence dia '+k.venc:''}${k.limite?' · limite '+fmt(k.limite):''}</small></div></div>`).join(''):empty('💳','Nenhum cartão. Com o dia de fechamento, o vencimento da fatura é calculado sozinho.')}</div>
  <div class="card"><div class="ch"><div class="ct">💾 Dados</div></div><div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn bs" onclick="backup()">⬇️ Fazer backup</button><label class="btn bs" style="cursor:pointer">⬆️ Restaurar backup<input type="file" accept=".json" hidden onchange="restaurar(event)"></label><button class="btn bs" onclick="csv()">📄 Exportar CSV (Excel)</button><button class="btn bdg" onclick="zerar()">🗑️ Apagar tudo</button></div><p class="mut" style="font-size:12px;margin-top:.6rem">Restaurar aceita também o backup da versão anterior do app.</p></div>`;
};
function abrirCat(id){
  const c=id?db.categorias.find(x=>x.id===id):{tipo:'despesa',icone:'📦',cor:CORES[db.categorias.length%CORES.length],orcamento:0};FM={c:{...c}};
  const EM=['🛒','🍔','🏠','⚡','🚗','⛽','💊','📚','🎬','📺','👕','💼','💰','➕','🎁','✈️','🐶','💇','🏋️','☕','🔧','📱','👶','⛪','🎓','🏦','💳','📦'];

  <div class="fg"><label>Ícone</label><div class="chips">${EM.map(e=>`<button class="chip ${c.icone===e?'on':''}" onclick="FM.c.icone='${e}';this.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${e}</button>`).join('')}</div></div>
  <div class="fr"><div class="fg"><label>Tipo</label><select id="c_tipo">${[['despesa','Despesa'],['receita','Receita'],['ambos','Ambos']].map(([k,l])=>`<option value="${k}" ${c.tipo===k?'selected':''}>${l}</option>`).join('')}</select></div><div class="fg"><label>Cor</label><input type="color" id="c_cor" value="${c.cor||'#3B82D6'}" style="height:42px;padding:4px"></div></div>

}
function salvarCat(id){const nome=$('#c_nome').value.trim();if(!nome)return toast('⚠️ Informe o nome');salvar('categorias',{...FM.c,id:id||uid(),nome,tipo:$('#c_tipo').value,cor:$('#c_cor').value,orcamento:parseValor($('#c_orc').value)});fecharModal();commit('✅ Categoria salva')}
function abrirCartao(id){

  <div class="fg"><label>Ícone</label><div class="chips">${['💳','💜','🟠','🔴','🟡','🟢','🔵','⚫','⚪'].map(e=>`<button class="chip ${k.icone===e?'on':''}" onclick="FM.k.icone='${e}';this.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${e}</button>`).join('')}</div></div>

  <div class="fr"><div class="fg"><label>Limite</label><input id="k_lim" inputmode="decimal" value="${vstr(k.limite)}" placeholder="Opcional"></div><div class="fg"><label>Cor</label><input type="color" id="k_cor" value="${k.cor||'#3B82D6'}" style="height:42px;padding:4px"></div></div>
  <div style="display:flex;gap:.5rem"><button class="btn bp" style="flex:1;padding:.8rem" onclick="salvarCartao('${id||''}')">Salvar</button>${id?`<button class="btn bdg" onclick="if(confirm('Excluir cartão?')){remover('cartoes','${id}');fecharModal();commit('🗑️ Cartão excluído')}">🗑️</button>`:''}</div>`;abrirModal();

function salvarCartao(id){const nome=$('#k_nome').value.trim();if(!nome)return toast('⚠️ Informe o nome');const d=s=>Math.min(31,Math.max(0,parseInt($(s).value)||0))||null;salvar('cartoes',{...FM.k,id:id||uid(),nome,fech:d('#k_fech'),venc:d('#k_venc'),limite:parseValor($('#k_lim').value)||null,cor:$('#k_cor').value});fecharModal();commit('✅ Cartão salvo')}
function instalar(){if(dpInstall){dpInstall.prompt();dpInstall=null}}

// ---------- BACKUP / CSV ----------
function backup(){const o={...db};delete o._fila;baixar(JSON.stringify(o,null,1),'financas-backup-'+hoje()+'.json','application/json');toast('⬇️ Backup baixado')}
function importarObj(d){
  const N=(a,f)=>(Array.isArray(a)?a:[]).map(x=>{const o=f(x);o.id=cid(x.id)||uid();o.updated_at=x.updated_at||now();return o});
  db.categorias=d.categorias&&d.categorias.length?N(d.categorias,(c,i)=>({nome:c.nome||'Categoria',icone:c.icone||'📦',tipo:c.tipo||'ambos',cor:/^#[0-9a-f]{6}$/i.test(c.cor||'')?c.cor:CORES[Math.floor(Math.random()*12)],orcamento:+c.orcamento||0})):catsPadrao();
  db.receitas=N(d.receitas,r=>({descricao:r.descricao||'',valor:r2(r.valor),data:r.data||hoje(),categoria_id:cid(r.categoria_id),forma:r.forma||'pix',obs:r.obs||r.observacao||'',dizimo:r.dizimo!==false,dizimo_pct:r.dizimo_pct??(d.config&&d.config.dizimoPct)??10}));
  db.despesas=N(d.despesas,x=>({descricao:x.descricao||'',valor:r2(x.valor),data:x.data||hoje(),vencimento:x.vencimento||x.data||hoje(),categoria_id:cid(x.categoria_id),forma:x.forma||'pix',cartao_id:cid(x.cartao_id),status:x.status==='pendente'?'pendente':'pago',pago_em:x.pago_em||null,grupo_parcela:cid(x.grupo_parcela),parcela:x.parcela||(String(x.descricao||'').match(/\((\d+\/\d+)\)$/)||[])[1]||'',recorrente_id:cid(x.recorrente_id),obs:x.obs||x.observacao||''}));
  db.dizimos=N(d.dizimos,z=>({receita_id:cid(z.receita_id),descricao:z.descricao||'Dízimo',valor:r2(z.valor),data:z.data||hoje(),status:z.status==='pago'?'pago':'pendente',pago_em:z.pago_em||null,pct:z.pct||null,tipo:z.tipo||''}));
  db.cartoes=N(d.cartoes,k=>({nome:k.nome||'Cartão',icone:k.icone||k.bandeira||'💳',cor:k.cor||'#3B82D6',fech:k.fech||null,venc:k.venc||k.vencimento_dia||null,limite:+k.limite||null}));
  db.recorrentes=N(d.recorrentes,r=>({descricao:r.descricao||'',valor:r2(r.valor),dia:r.dia||r.dia_vencimento||1,categoria_id:cid(r.categoria_id),forma:r.forma||'boleto',cartao_id:cid(r.cartao_id),inicio:r.inicio||(r.criado_em||now()).slice(0,7),ativo:r.ativo!==false,puladas:r.puladas||[]}));
  db.config={nome:(d.config&&d.config.nome&&d.config.nome!=='Usuário')?d.config.nome:'',dizimoPct:(d.config&&+d.config.dizimoPct)||10,updated_at:now()};
}
function restaurar(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!confirm('Substituir TODOS os dados atuais pelo backup?'))return;COLS.forEach(c=>db[c].forEach(x=>db._fila[c+':'+x.id]='del'+Date.now()));importarObj(d);marcarTudo();commit('✅ Backup restaurado')}catch(err){toast('⚠️ Arquivo inválido')}};rd.readAsText(f);e.target.value=''}
function zerar(){if(!confirm('Apagar TODOS os lançamentos, cartões e categorias?'))return;if(!confirm('Tem certeza? Não dá para desfazer (faça um backup antes).'))return;COLS.forEach(c=>db[c].forEach(x=>db._fila[c+':'+x.id]='del'+Date.now()));COLS.forEach(c=>db[c]=[]);db.categorias=catsPadrao();marcarTudo();commit('🗑️ Dados apagados')}
function csv(){
  const L=[];db.receitas.forEach(r=>L.push(['Receita',r.data,r.descricao,cat(r.categoria_id)?.nome||'',fmtForma(r.forma),'Recebido','',r.valor]));
  db.despesas.forEach(d=>L.push(['Despesa',d.data,d.descricao+(d.parcela?' ('+d.parcela+')':''),cat(d.categoria_id)?.nome||'',fmtForma(d.forma)+(cart(d.cartao_id)?' '+cart(d.cartao_id).nome:''),pg(d)?'Pago':'Pendente',d.vencimento||'',-d.valor]));
  db.dizimos.forEach(z=>L.push([z.receita_id?'Dízimo':'Oferta',z.data,z.descricao,'','',pg(z)?'Pago':'Pendente','',-z.valor]));
  L.sort((a,b)=>a[1].localeCompare(b[1]));
  const txt='﻿'+[['Tipo','Data','Descrição','Categoria','Forma','Status','Vencimento','Valor'],...L].map(r=>r.map((v,i)=>i===7&&typeof v==='number'?String(r2(v)).replace('.',','):'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  baixar(txt,'financas-'+hoje()+'.csv','text/csv;charset=utf-8');toast('📄 CSV exportado');
}

// ================= NUVEM (Supabase · código de acesso) =================
let sb=null,syncT=null,syncing=false,syncSt='local';
const chave=()=>localStorage.getItem(LSK)||'';
function setSync(s){syncSt=s;const m={local:['💾','Local'],lock:['🔒','Código'],sync:['🔄','Sincronizando'],ok:['☁️','Sincronizado'],erro:['⚠️','Offline']}[s];$('#syncBadge').innerHTML=m[0]+' <span class="t">'+m[1]+'</span>';$('#syncBadge').title=s==='erro'?'Sem conexão com a nuvem. Os dados estão salvos no aparelho.':''}
function loadLib(){return window.supabase?Promise.resolve():new Promise((ok,er)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=ok;s.onerror=er;document.head.appendChild(s)})}
const cliente=c=>supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false},global:{headers:{'x-chave':c}}});
async function initCloud(){if(!chave()){setSync('lock');pedirChave();return}try{await loadLib();sb=cliente(chave());sincronizar()}catch(e){setSync('erro')}}
function pedirChave(){
  $('#sheet').innerHTML=`<div class="sh-h"><h2>🔒 Código de acesso</h2><button class="x" onclick="fecharModal()">✕</button></div><p class="mut" style="font-size:13px;margin-bottom:1rem">Digite seu código. Ele é pedido só uma vez neste aparelho.</p><div class="fg"><input id="kCod" type="password" autocomplete="current-password" placeholder="Seu código" onkeydown="if(event.key==='Enter')validarChave()"></div><button class="btn bp" style="width:100%;padding:.8rem" onclick="validarChave()">Entrar</button>`;
  abrirModal();setTimeout(()=>{const e=$('#kCod');if(e)e.focus()},120);
}
async function validarChave(){
  const c=$('#kCod').value.trim();if(!c)return;
  try{await loadLib();const t=cliente(c),{data,error}=await t.rpc('fin_check');if(error)throw error;if(!data)return toast('⚠️ Código incorreto');
    localStorage.setItem(LSK,c);if(!db._sync&&COLS.some(k=>k!=='categorias'&&db[k].length))marcarTudo();sb=t;fecharModal();toast('✅ Conectado!');sincronizar(true);
  }catch(e){toast('⚠️ '+(e.message||'Sem conexão'))}
}
function esquecerChave(){if(!confirm('Desconectar este aparelho da nuvem? Os dados continuam aqui.'))return;localStorage.removeItem(LSK);sb=null;db._sync='';gravar();setSync('lock');render()}
function agendarSync(){if(!sb)return;clearTimeout(syncT);syncT=setTimeout(sincronizar,1200)}
async function sincronizar(manual){
  if(!sb){if(manual)chave()?initCloud():pedirChave();return}
  if(syncing)return;syncing=true;setSync('sync');
  try{
    const snap={...db._fila},keys=Object.keys(snap);
    if(keys.length){
      const rows=keys.map(k=>{const i=k.indexOf(':'),col=k.slice(0,i),id=k.slice(i+1),o=col==='config'?db.config:(db[col]||[]).find(x=>x.id===id),del=String(snap[k]).startsWith('del')||!o;
        return{id:k,tipo:col,dados:del?{}:o,deleted:del,updated_at:(o&&o.updated_at)||now()}});
      for(let i=0;i<rows.length;i+=500){const{error}=await sb.from('fin_registros').upsert(rows.slice(i,i+500),{onConflict:'id'});if(error)throw error}
      keys.forEach(k=>{if(db._fila[k]===snap[k])delete db._fila[k]});
    }
    let all=[],from=0;for(;;){const{data,error}=await sb.from('fin_registros').select('id,tipo,dados,deleted').range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}
    let mud=false;
    all.forEach(r=>{const col=r.tipo,id=r.id.slice(col.length+1);if(db._fila[r.id])return;
      if(col==='config'){if(!r.deleted&&r.dados&&(r.dados.updated_at||'')>(db.config.updated_at||'')){db.config=r.dados;mud=true}return}
      if(!db[col])return;const a=db[col],i=a.findIndex(x=>x.id===id);
      if(r.deleted){if(i>=0){a.splice(i,1);mud=true}return}
      if(i<0){a.push(r.dados);mud=true}else if((r.dados.updated_at||'')>(a[i].updated_at||'')){a[i]=r.dados;mud=true}});
    db._sync=now();gravar();if(mud||manual)render();setSync('ok');if(manual)toast('☁️ Sincronizado');
  }catch(e){console.error(e);
    if(e.code==='42501'){localStorage.removeItem(LSK);sb=null;setSync('lock');toast('🔒 Código inválido. Digite novamente.');pedirChave()}
    else{setSync('erro');if(manual)toast('⚠️ '+(e.message||'Falha ao sincronizar'))}}
  syncing=false;if(Object.keys(db._fila).length&&syncSt==='ok')agendarSync();
}

// ================= INIT =================
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]'),tp=$('#tip');if(t){tp.innerHTML=t.dataset.tip;tp.classList.add('on')}else tp.classList.remove('on')});
document.addEventListener('mousemove',e=>{const tp=$('#tip');if(!tp.classList.contains('on'))return;tp.style.left=Math.min(e.clientX+14,innerWidth-tp.offsetWidth-8)+'px';tp.style.top=Math.min(e.clientY+14,innerHeight-tp.offsetHeight-8)+'px'});
document.addEventListener('touchstart',()=>$('#tip').classList.remove('on'),{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharModal();if(e.key==='Enter'&&$('#modal').classList.contains('on')&&e.target.tagName==='INPUT'&&$('#f_valor')){e.preventDefault();salvarLanc()}});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dpInstall=e;if(sec==='ajustes')render()});
addEventListener('online',()=>sincronizar());
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(mes<ymAtual()&&sec==='inicio'){}sincronizar()}});
carregar();
const h0=location.hash.slice(1);if(V[h0])sec=h0;
render();setSync('local');initCloud();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
